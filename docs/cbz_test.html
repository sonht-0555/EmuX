<!DOCTYPE html><html lang="vi"><head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>CBZ Mobile Bench | EmuX</title> <style> :root { --bg: #0f0f12; --panel: #18181f; --border: #2a2a35; --text: #f0f0f5; --dim: #888899; --accent: #00e676; --danger: #ff5252; --warning: #ffb74d; } * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; } body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; } /* Top Bar */ #topbar { height: 48px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; flex-shrink: 0; z-index: 100; } .app-title { font-size: 14px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 6px; } .top-actions { display: flex; align-items: center; gap: 8px; } .btn-sm { background: #252530; color: #fff; border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; } .btn-sm.active { background: var(--accent); color: #000; border-color: var(--accent); } /* Stats HUD (Nổi phía trên) */ #stats-hud { background: rgba(15, 15, 18, 0.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 8px 12px; font-size: 11px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; flex-shrink: 0; z-index: 90; } .stat-item { display: flex; justify-content: space-between; align-items: center; } .stat-item span:first-child { color: var(--dim); } .stat-val { font-weight: bold; color: #fff; } .stat-val.green { color: var(--accent); } .stat-val.yellow { color: var(--warning); } /* Viewer Cuộn Truyện */ #viewer-wrap { flex-grow: 1; position: relative; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #000; } #viewer { display: flex; flex-direction: column; align-items: center; min-height: 100%; } /* Từng trang Manga */ .manga-page { width: 100vw; max-width: 100%; background: #121214; display: flex; align-items: center; justify-content: center; position: relative; min-height: 320px; border-bottom: 1px solid #1c1c22; } .manga-page img { width: 100%; height: auto; display: block; background: #000; } .page-badge { position: absolute; top: 8px; left: 8px; background: rgba(0, 0, 0, 0.7); color: #fff; padding: 2px 7px; font-size: 10px; border-radius: 4px; pointer-events: none; z-index: 2; } /* Bottom Floating Bar */ #bottom-bar { height: 52px; background: var(--panel); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; padding: 0 8px; flex-shrink: 0; z-index: 100; } .b-btn { background: #252530; color: #fff; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; } .b-btn:active { background: #333342; } /* Modal chọn file / info */ #drop-overlay { position: absolute; inset: 0; background: rgba(10, 10, 14, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; z-index: 200; } #drop-overlay.hidden { display: none; } .upload-card { background: var(--panel); border: 2px dashed #444; border-radius: 16px; padding: 28px 20px; width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 14px; } .file-btn { background: var(--accent); color: #000; font-weight: bold; padding: 12px 24px; border-radius: 24px; font-size: 14px; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 230, 118, 0.3); } input[type="file"] { display: none; } /* Floating Mini Log Toast */ #log-toast { position: absolute; bottom: 60px; left: 12px; right: 12px; background: rgba(20, 20, 26, 0.92); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 11px; color: #ddd; display: flex; align-items: center; justify-content: space-between; z-index: 150; pointer-events: none; transition: opacity 0.3s; } </style> <script src="../src/utils/zip.js"></script></head><body> <div id="topbar"> <div class="app-title"> <span>⚡ EmuX Bench</span> </div> <div class="top-actions"> <button class="btn-sm active" id="btn-mode-lazy">Lazy (Khuyên dùng)</button> <button class="btn-sm" id="btn-mode-all">Sync All</button> <button class="btn-sm" id="btn-open-file">📁 Đổi file</button> </div> </div> <div id="stats-hud"> <div class="stat-item"> <span>File:</span> <span class="stat-val" id="val-file">Chưa nạp</span> </div> <div class="stat-item"> <span>RAM (Heap):</span> <span class="stat-val yellow" id="val-ram">-</span> </div> <div class="stat-item"> <span>Trang:</span> <span class="stat-val green" id="val-pages">0 / 0</span> </div> <div class="stat-item"> <span>Quét Header:</span> <span class="stat-val" id="val-header-time">-</span> </div> </div> <div id="viewer-wrap"> <div id="viewer"></div> </div> <div id="log-toast"> <span id="log-text">Sẵn sàng test file CBZ/ZIP lớn...</span> <span style="color:var(--accent); font-size:10px;">LIVE</span> </div> <div id="bottom-bar"> <button class="b-btn" id="btn-jump">🚀 Nhảy trang</button> <button class="b-btn" id="btn-top">⬆ Về đầu</button> <button class="b-btn" id="btn-bottom">⬇ Xuống cuối</button> </div> <div id="drop-overlay"> <div class="upload-card"> <div style="font-size: 38px;">📚</div> <h3 style="font-size: 16px;">Test CBZ 500MB+</h3> <p style="font-size: 12px; color: var(--dim);">Chọn file .cbz hoặc .zip (300MB, 500MB, 1GB+) trên điện thoại để test</p> <label class="file-btn"> Chọn File CBZ / ZIP <input type="file" id="file-input"> </label> </div> </div> <script> const $ = id => document.getElementById(id); const toast = msg => { $('log-text').textContent = msg; console.log('[BENCH]', msg); }; let mode = 'lazy'; // 'lazy' | 'all' let currentBuffer = null; let fileEntries = []; // { name, csize, size, localHeaderOffset, method } let pageHeights = []; let blobUrlMap = new Map(); const CHUNK_SIZE = 8; let currentPage = 0; // Báo RAM định kỳ setInterval(() => { if (performance.memory) { const used = (performance.memory.usedJSHeapSize / 1048576).toFixed(1); const total = (performance.memory.totalJSHeapSize / 1048576).toFixed(1); $('val-ram').textContent = `${used}MB / ${total}MB`; } else { $('val-ram').textContent = 'N/A (Safari/iOS)'; } }, 1000); // Nút đổi chế độ $('btn-mode-lazy').onclick = () => { mode = 'lazy'; $('btn-mode-lazy').classList.add('active'); $('btn-mode-all').classList.remove('active'); toast('Đã bật Lazy Mode (Chỉ giải nén trang đang xem)'); if (currentBuffer) processFile(currentBuffer); }; $('btn-mode-all').onclick = () => { if (!confirm("Chế độ Sync All giải nén toàn bộ vào RAM cùng lúc, có thể làm crash Safari trên iPhone nếu file > 400MB. Bạn có chắc muốn thử không?")) return; mode = 'all'; $('btn-mode-all').classList.add('active'); $('btn-mode-lazy').classList.remove('active'); toast('Đã bật Sync All (Giải nén toàn bộ)'); if (currentBuffer) processFile(currentBuffer); }; $('btn-open-file').onclick = () => $('drop-overlay').classList.remove('hidden'); // Nhận file $('file-input').onchange = async e => { const file = e.target.files[0]; if (!file) return; $('drop-overlay').classList.add('hidden'); $('val-file').textContent = `${(file.size / 1048576).toFixed(1)}MB`; toast(`Đang nạp ArrayBuffer ${(file.size / 1048576).toFixed(1)}MB...`); const t0 = performance.now(); currentBuffer = await file.arrayBuffer(); toast(`Đã nạp file vào RAM trong ${(performance.now() - t0).toFixed(0)}ms. Bắt đầu xử lý!`); processFile(currentBuffer); }; // ========================================== // ZIP CENTRAL DIRECTORY PARSER (0 MB RAM, < 5ms) // ========================================== function parseZipCentralDirectory(buffer) { const u8 = new Uint8Array(buffer); const len = u8.length; const view = new DataView(buffer); // Tìm EOCD signature (0x06054b50) let eocdOffset = -1; const maxSearch = Math.min(len, 65536 + 22); for (let i = len - 22; i >= len - maxSearch; i--) { if (view.getUint32(i, true) === 0x06054b50) { eocdOffset = i; break; } } if (eocdOffset === -1) throw new Error("Không đúng chuẩn file ZIP!"); const cdSize = view.getUint32(eocdOffset + 12, true); const cdOffset = view.getUint32(eocdOffset + 16, true); const entries = []; const imgExts = /\.(jpe?g|png|webp|gif|avif)$/i; const decoder = new TextDecoder('utf-8'); let p = cdOffset; while (p < cdOffset + cdSize) { if (view.getUint32(p, true) !== 0x02014b50) break; const method = view.getUint16(p + 10, true); const csize = view.getUint32(p + 20, true); const size = view.getUint32(p + 24, true); const nameLen = view.getUint16(p + 28, true); const extraLen = view.getUint16(p + 30, true); const commentLen = view.getUint16(p + 32, true); const localHeaderOffset = view.getUint32(p + 42, true); const nameBytes = u8.subarray(p + 46, p + 46 + nameLen); const name = decoder.decode(nameBytes); if (imgExts.test(name) && !name.startsWith('__MACOSX') && !name.endsWith('/')) { entries.push({ name, method, csize, size, localHeaderOffset }); } p += 46 + nameLen + extraLen + commentLen; } const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' }); entries.sort((a, b) => collator.compare(a.name, b.name)); return entries; } // ========================================== // GIẢI NÉN ĐƠN LẺ 1 TRANG TỪ LOCAL HEADER OFFSET // ========================================== function extractSingleEntry(buffer, entry) { const u8 = new Uint8Array(buffer); const view = new DataView(buffer); const p = entry.localHeaderOffset; if (view.getUint32(p, true) !== 0x04034b50) { throw new Error("Lỗi Local Header Offset tại trang: " + entry.name); } const nameLen = view.getUint16(p + 26, true); const extraLen = view.getUint16(p + 28, true); const dataOffset = p + 30 + nameLen + extraLen; const compressedSlice = u8.subarray(dataOffset, dataOffset + entry.csize); if (entry.method === 0) { return new Blob([compressedSlice], { type: 'image/jpeg' }); } else if (entry.method === 8) { // Thư viện fflate giải nén DEFLATE chỉ 1-2ms/ảnh const decompressed = fflate.inflateSync(compressedSlice); return new Blob([decompressed], { type: 'image/jpeg' }); } else { throw new Error("Chưa hỗ trợ compression method: " + entry.method); } } // ========================================== // XỬ LÝ CHÍNH // ========================================== async function processFile(buffer) { $('viewer').innerHTML = ''; fileEntries = []; pageHeights = []; blobUrlMap.forEach(url => URL.revokeObjectURL(url)); blobUrlMap.clear(); if (mode === 'lazy') { const t0 = performance.now(); try { fileEntries = parseZipCentralDirectory(buffer); const tHeader = (performance.now() - t0).toFixed(1); $('val-header-time').textContent = `${tHeader}ms`; $('val-pages').textContent = `1 / ${fileEntries.length}`; toast(`Quét xong ${fileEntries.length} trang trong ${tHeader}ms!`); pageHeights = new Float32Array(fileEntries.length); initPlaceholders(); renderWindow(0); } catch (e) { alert("Lỗi đọc ZIP: " + e.message); } } else { toast("Đang bung toàn bộ file vào RAM bằng unzipSync..."); setTimeout(() => { try { const t0 = performance.now(); const files = fflate.unzipSync(new Uint8Array(buffer)); const imgExts = /\.(jpe?g|png|webp|gif|avif)$/i; const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' }); const names = Object.keys(files).filter(n => imgExts.test(n) && files[n].length > 0).sort((a,b) => collator.compare(a, b)); const tHeader = (performance.now() - t0).toFixed(1); $('val-header-time').textContent = `${tHeader}ms`; toast(`Đã giải nén toàn bộ ${names.length} file trong ${tHeader}ms`); fileEntries = names.map((n, i) => { const blob = new Blob([files[n]], { type: 'image/jpeg' }); blobUrlMap.set(i, URL.createObjectURL(blob)); return { name: n }; }); pageHeights = new Float32Array(fileEntries.length); initPlaceholders(); renderWindow(0); } catch (e) { alert("CRASH: Quá tải RAM! " + e.message); } }, 50); } } // Tạo placeholder giữ chiều cao function initPlaceholders() { const v = $('viewer'); let html = ''; for (let i = 0; i < fileEntries.length; i++) { html += `<div class="manga-page" id="p-${i}" data-index="${i}"> <span class="page-badge">#${i + 1}</span> </div>`; } v.innerHTML = html; } // Cửa sổ trượt 5 lô (~40 trang) async function renderWindow(centerPage) { currentPage = centerPage; const curChunk = Math.floor(centerPage / CHUNK_SIZE); const startPage = Math.max(0, (curChunk - 2) * CHUNK_SIZE); const endPage = Math.min(fileEntries.length, (curChunk + 3) * CHUNK_SIZE); $('val-pages').textContent = `${centerPage + 1} / ${fileEntries.length}`; for (let i = 0; i < fileEntries.length; i++) { const el = $('p-' + i); if (!el) continue; if (i >= startPage && i < endPage) { if (!el.querySelector('img')) { let url = blobUrlMap.get(i); if (!url && mode === 'lazy') { try { const blob = extractSingleEntry(currentBuffer, fileEntries[i]); url = URL.createObjectURL(blob); blobUrlMap.set(i, url); } catch (err) { console.error(`Lỗi trang ${i}:`, err); } } if (url) { const img = document.createElement('img'); img.src = url; img.onload = () => { const h = img.offsetHeight; if (h > 0) { pageHeights[i] = h; el.style.minHeight = `${h}px`; } }; el.appendChild(img); } } } else { // Ngoài cửa sổ -> dọn dẹp giải phóng RAM ngay if (el.querySelector('img')) { const h = el.offsetHeight || pageHeights[i]; if (h > 0) { pageHeights[i] = h; el.style.minHeight = `${h}px`; } el.innerHTML = `<span class="page-badge">#${i + 1}</span>`; if (mode === 'lazy' && blobUrlMap.has(i)) { URL.revokeObjectURL(blobUrlMap.get(i)); blobUrlMap.delete(i); } } } } } // Bắt sự kiện cuộn let scrollTmr; $('viewer-wrap').onscroll = () => { clearTimeout(scrollTmr); scrollTmr = setTimeout(() => { const wrap = $('viewer-wrap'); const r = wrap.getBoundingClientRect(); const centerY = r.top + r.height / 3; const pages = $('viewer').children; for (let i = 0; i < pages.length; i++) { const rect = pages[i].getBoundingClientRect(); if (rect.top <= centerY && rect.bottom >= centerY) { const idx = Number(pages[i].getAttribute('data-index')); if (idx !== currentPage && !isNaN(idx)) { renderWindow(idx); } break; } } }, 60); }; // Điều khiển phím đáy $('btn-jump').onclick = () => { if (!fileEntries.length) return; const p = prompt(`Nhập số trang muốn nhảy tới (1 - ${fileEntries.length}):`, currentPage + 1); if (p) { const idx = Math.max(0, Math.min(fileEntries.length - 1, Number(p) - 1)); renderWindow(idx); const target = $('p-' + idx); if (target) target.scrollIntoView({ behavior: 'smooth' }); } }; $('btn-top').onclick = () => { $('viewer-wrap').scrollTo({ top: 0, behavior: 'smooth' }); }; $('btn-bottom').onclick = () => { $('viewer-wrap').scrollTo({ top: $('viewer-wrap').scrollHeight, behavior: 'smooth' }); }; </script></body></html>
