<!doctype html><html lang="vi"> <head> <meta charset="utf-8" /> <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" /> <title>Klotski</title> <style> :root { --page-background: #000; --theme-board-border: #2f323e; --theme-regular-piece: #2f323e; --theme-soldier: #4d5964; --theme-liu-bei: #748380; --theme-cao-cao: #b8c7bf; --theme-piece-text: #b8c7bf; --theme-cao-cao-text: #2f323e; } * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; } html { background: var(--page-background); } body { margin: 0; min-height: 100svh; display: grid; place-items: center; overflow: hidden; background: var(--page-background); color: var(--theme-soldier); font-family: "3x3", monospace; filter: brightness(1) contrast(1.2) saturate(0.8) sepia(0.2) grayscale(0) } body::before { content: ""; position: fixed; inset: 0; z-index: 2000; pointer-events: none; /*background: url("data:image/svg+xml,%3Csvg width='1' height='1' viewBox='0 0 1 1' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1H0.666992V0.666992H1V1ZM0.666992 0.666992H0.333008V0.333008H0.666992V0.666992ZM0.333008 0.333008H0V0H0.333008V0.333008Z' fill='black'/%3E%3C/svg%3E%0A"); mix-blend-mode: overlay;*/ } @font-face { font-family: "3x3"; src: url("3x3.ttf") format("truetype"); font-display: swap; } .app { --cell: 64px; --gap: 4px; width: min(100%, 390px); min-height: 100svh; padding-bottom: 200px; display: grid; grid-template-rows: auto 4px auto; justify-items: center; align-content: end; text-align: center; } .status { width: calc(var(--cell) * 4 + var(--gap) * 3 + 12px); display: flex; gap: 4px; align-items: center; font-size: 8px; } .status button { position: relative; height: 10px; display: grid; place-items: center; border: 0; border-radius: 0; padding: 2px 0px 2px 2px; color: var(--page-background); font: inherit; appearance: none; } .status button::before { content: ""; position: absolute; inset: -40px 0 0; } .status .level { background: var(--theme-regular-piece); } .status .undo { background: var(--theme-soldier); } .board-wrap { grid-row: 3; width: max-content; padding: 4px; border: 2px solid var(--theme-board-border); } .board { display: grid; grid-template-columns: repeat(4, var(--cell)); grid-template-rows: repeat(5, var(--cell)); gap: var(--gap); touch-action: none; overflow: hidden; contain: layout paint; isolation: isolate; } .piece { z-index: 1; display: flex; flex-direction: column; justify-content: end; align-items: start; padding: 4px; user-select: none; -webkit-user-select: none; background: var(--theme-regular-piece); } .piece-name { display: block; font-size: 8px; pointer-events: none; color: var(--theme-piece-text); } .piece-name-first { padding-bottom: 2px; } .piece.hero { background: var(--theme-cao-cao); } .piece.hero::before { content: ""; width: 10px; height: 6px; margin-bottom: 2px; pointer-events: none; mask: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2 0V2H4V0H6V2H8V0H10V6H0V0H2Z' fill='white'/%3E%3C/svg%3E%0A"); background-color: var(--theme-cao-cao-text); } .piece.hero .piece-name { color: var(--theme-cao-cao-text); } .piece.soldier { background: var(--theme-soldier); } .piece[data-id="4"] { background: var(--theme-liu-bei); } .piece[data-id="5"], .piece[data-id="8"] { background: var(--theme-regular-piece); } .piece.dragging { z-index: 5; will-change: transform; backface-visibility: hidden; } </style> </head> <body> <main class="app"> <div class="status"> <button class="undo" type="button"></button> <button class="level" type="button"></button> </div> <div class="board-wrap"> <div class="board" aria-label="Klotski"></div> </div> </main> <script src="index.js"></script> </body></html>
