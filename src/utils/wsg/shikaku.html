<!doctype html>
<html lang="vi">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
      <title>Shikaku</title>
      <style>
         :root {
            --page-background: #000;
            --theme-board-border: #2f323e;
            --theme-regular-piece: #2f323e;
            --theme-soldier: #4d5964;
            --theme-liu-bei: #748380;
            --theme-cao-cao: #b8c7bf;
            --theme-piece-text: #b8c7bf;
            --theme-cao-cao-text: #2f323e;
         }

         * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
         }

         html {
            background: var(--page-background);
         }

         body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--page-background);
            color: var(--theme-soldier);
            font-family: "3x3", monospace;
            filter: brightness(1) contrast(1.2) saturate(0.8) sepia(0.2) grayscale(0)
         }

         @font-face {
            font-family: "3x3";
            src: url("3x3.ttf") format("truetype");
            font-display: swap;
         }

         .app {
            --cell: 48px;
            --gap: 2px;
            --size: 5;
            --clue-font: 12px;
            --line: 2px; /* viền ngoài bàn cờ và viền khung kéo; shikaku.js đặt bằng --gap */
            width: min(100%, 390px);
            min-height: 100svh;
            padding-bottom: 200px;
            display: grid;
            grid-template-rows: auto 4px auto;
            justify-items: center;
            align-content: end;
            text-align: center;
         }

         .status {
            width: calc(var(--cell) * var(--size) + var(--gap) * (var(--size) + 1) + var(--line) * 2);
            display: flex;
            gap: 4px;
            align-items: center;
            font-size: 8px;
         }

         .status button {
            position: relative;
            height: 10px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 0;
            padding: 2px 0px 2px 2px;
            color: var(--page-background);
            font: inherit;
            appearance: none;
         }

         .status button::before {
            content: "";
            position: absolute;
            inset: -40px 0 0;
         }

         .status .level {
            background: var(--theme-regular-piece);
         }

         .status .undo {
            background: var(--theme-soldier);
         }

         .board-wrap {
            grid-row: 3;
            width: max-content;
            padding: var(--gap);
            border: var(--line) solid var(--theme-board-border);
         }

         .board {
            display: grid;
            grid-template-columns: repeat(var(--size), var(--cell));
            grid-template-rows: repeat(var(--size), var(--cell));
            gap: var(--gap);
            touch-action: none;
            contain: layout paint;
            isolation: isolate;
         }

         .tile {
            z-index: 0;
            background: var(--theme-regular-piece);
         }

         .rect {
            z-index: 1;
            pointer-events: none;
         }

         .rect.c0 {
            background: var(--theme-soldier);
         }

         .rect.c1 {
            background: var(--theme-liu-bei);
         }

         .rect.c2 {
            background: var(--theme-cao-cao);
         }

         .rect.preview {
            z-index: 3;
            background: transparent;
            box-shadow: inset 0 0 0 var(--line) var(--theme-soldier);
         }

         .clue {
            z-index: 2;
            display: grid;
            place-items: center;
            font-size: var(--clue-font);
            padding-left: 0.25em;
            pointer-events: none;
            color: var(--theme-piece-text);
         }

         .clue.dark {
            color: var(--theme-cao-cao-text);
         }
      </style>
   </head>
   <body>
      <main class="app">
         <div class="status">
            <button class="undo" type="button"></button>
            <button class="level" type="button"></button>
         </div>
         <div class="board-wrap">
            <div class="board" aria-label="Shikaku"></div>
         </div>
      </main>
      <script src="shikaku.js"></script>
   </body>
</html>
